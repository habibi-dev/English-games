server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The app is a hash-router SPA, so every path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker and bank files must always be fresh so updates reach the phone.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
